<link rel="icon" href="/favicon.ico" sizes="any">

<a href="index.html" class="home-button icon solid fa-home">
	<span class="label">Home</span>
</a>

		<!-- Header -->
			<header id="header">
				<div class="inner">
					<a href="#Curry Logo" class="image avatar"><img src="images/logo.jpg" alt="Curry Church of Christ logo" /></a>
					<h1><strong>Curry Church of Christ</strong></h1>
				</div>
			</header>

		<!-- Main -->
			<div id="main">

				<!-- One -->
					<section id="one">
						<header class="major">
							<h2>Curry Church of Christ</h2>
						</header>
						<p>Find us using the map below!</p>
					</section>
					
							<div class="map-container">
								<iframe
									src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3309.9125715824384!2d-87.21714709999999!3d33.9433767!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x88885d54aa1823e5%3A0xc10452c8ae7e066a!2s5454%20Curry%20Hwy%2C%20Jasper%2C%20AL%2035503!5e0!3m2!1sen!2sus!4v1789189498819!5m2!1sen!2sus"
									title="Map showing Curry Church of Christ"
									width="100%"
									height="525"
									style="display:block; width:100%; height:525px; border:0;"
									allowfullscreen
									loading="lazy"
									referrerpolicy="strict-origin-when-cross-origin">
								</iframe>
							</div>	
							
					<section id="three">
						<h2>Get In Touch</h2>
						<p>Let us know you paid us a visit by telling us about your time with us!</p>
							<div class="col-8 col-12-small">
								<form method="post" action="#">
									<div class="row gtr-uniform gtr-50">
										<div class="col-6 col-12-xsmall"><input type="text" name="name" id="name" placeholder="Name" /></div>
										<div class="col-6 col-12-xsmall"><input type="email" name="email" id="email" placeholder="Email" /></div>
										<div class="col-12"><textarea name="message" id="message" placeholder="Message" rows="4"></textarea></div>
									</div>
								</form>
								<ul class="actions">
									<li><input type="submit" value="Send Message" /></li>
								</ul>
							</div>
					</section>
	
			</div>

		<!-- Footer -->
			<footer id="footer">
				<div class="inner">
				<a href="#" class="footer-logo">
				<img src="images/logo.jpg" alt="Curry Church of Christ logo" />
